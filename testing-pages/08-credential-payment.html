<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm payment — Example Cloud</title>
    <style>
      body { font-family: system-ui, sans-serif; line-height: 1.55; margin: 0; background: #f8f6f2; color: #1c1c1c; }      main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1.25rem 2.5rem; }
      form { display: grid; gap: 0.75rem; max-width: 22rem; }
      label { font-weight: 600; }
      input, button { font: inherit; padding: 0.5rem; border-radius: 8px; border: 1px solid #ccc; }
      button { background: #b3261e; color: #fff; border: none; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>    <main>
      <h1>Your subscription will be cancelled today</h1>
      <p>
        Microsoft Example Cloud detected a billing problem. Enter your password
        and card details below to prevent service interruption and data loss.
      </p>
      <form action="#" method="get" onsubmit="return false;">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="off" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="off" />

        <label for="card">Card number</label>
        <input id="card" name="card" inputmode="numeric" autocomplete="off" />

        <label for="cvv">CVV</label>
        <input id="cvv" name="cvv" inputmode="numeric" autocomplete="off" />

        <button type="submit">Confirm payment immediately</button>
      </form>
    </main>
  </body>
</html>
