<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account message — Example Bank</title>
    <style>
      body { font-family: system-ui, sans-serif; line-height: 1.55; margin: 0; background: #f8f6f2; color: #1c1c1c; }      main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1.25rem 2.5rem; }
      .alert { background: #fff3e0; border: 2px solid #9a5b00; border-radius: 12px; padding: 1rem; }
    </style>
  </head>
  <body>    <main>
      <h1>Secure message center</h1>
      <div class="alert">
        <p>
          You have a new secure document. Open it using the link below to review
          your statement.
        </p>
        <p>
          <a href="https://www.example.org/secure/statement-test">
            https://www.example.com/secure/statement
          </a>
        </p>
      </div>
      <p>
        If you did not expect this message, contact
        <a href="https://www.example.com/contact">example.com/contact</a>.
      </p>
    </main>
  </body>
</html>
