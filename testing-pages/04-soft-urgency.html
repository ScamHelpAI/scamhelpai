<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spring sale ends Sunday — Example Shop</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.55;
        margin: 0;
        background: #f8f6f2;
        color: #1c1c1c;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 2.5rem;
      }
      .promo {
        background: #fff4e0;
        border-radius: 12px;
        padding: 1rem;
        border: 1px solid #ddd8ce;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Spring sale</h1>
      <div class="promo">
        <p>
          <strong>Offer ends Sunday at midnight.</strong> Save 15% on planters
          with code <code>SPRING15</code>. No account required.
        </p>
      </div>
      <p>
        Browse the catalog at
        <a href="https://www.example.com/shop">example.com/shop</a>. Returns
        accepted within 30 days with receipt.
      </p>
      <p>
        Questions? Email
        <a href="mailto:support@example.com">support@example.com</a>.
      </p>
    </main>
  </body>
</html>
