<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ScamHelp AI Settings</title>
    <style>
      body {
        max-width: 520px;
        margin: 0;
        padding: 20px;
        font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #14213d;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      label {
        font-weight: 600;
      }
      input[type="url"] {
        width: 100%;
        box-sizing: border-box;
        margin: 8px 0 12px;
        padding: 12px;
        font: 16px/1.4 inherit;
        border: 2px solid #9ca3af;
        border-radius: 10px;
      }
      button {
        width: 100%;
        padding: 16px;
        font: 600 18px/1.2 inherit;
        color: #ffffff;
        background: #146560;
        border: none;
        border-radius: 12px;
        cursor: pointer;
      }
      button:hover {
        background: #0f4a46;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 4px solid #f59e0b;
        outline-offset: 2px;
      }
      #status {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Settings</h1>
    <label for="api-base">ScamHelp analyzer address</label>
    <input id="api-base" type="url" placeholder="http://localhost:3000" />
    <button id="save" type="button">Save</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="options.js"></script>
  </body>
</html>
