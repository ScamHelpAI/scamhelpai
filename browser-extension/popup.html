<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScamHelp AI</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 16px;
        width: 320px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #1a1a1a;
        background: #fafafa;
      }

      .brand {
        margin: 0 0 4px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #666;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 18px;
        font-weight: 600;
        line-height: 1.3;
      }

      button {
        width: 100%;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: #1a56db;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #1648b8;
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .status {
        margin-top: 12px;
        font-size: 13px;
        color: #666;
      }

      .status--error {
        color: #b42318;
      }

      .result {
        margin-top: 12px;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #e5e5e5;
        background: #fff;
      }

      .result--low {
        border-color: #86efac;
        background: #f0fdf4;
      }

      .result--medium {
        border-color: #fcd34d;
        background: #fffbeb;
      }

      .result--high {
        border-color: #fca5a5;
        background: #fef2f2;
      }

      .score-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .score-value {
        font-size: 28px;
        font-weight: 700;
        line-height: 1;
      }

      .score-meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 12px;
        color: #444;
      }

      .score-level {
        font-weight: 600;
        text-transform: capitalize;
      }

      .recommendation {
        margin: 0 0 8px;
        font-size: 13px;
        line-height: 1.4;
      }

      .reasons {
        margin: 0;
        padding-left: 18px;
        font-size: 12px;
        line-height: 1.4;
        color: #444;
      }

      .reasons li + li {
        margin-top: 4px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <p class="brand">ScamHelp</p>
    <h1>Check this page</h1>
    <button id="check-btn" type="button">Check for scams</button>
    <p id="status" class="status hidden" role="status"></p>
    <section id="result" class="result hidden" aria-live="polite"></section>
    <script src="popup.js"></script>
  </body>
</html>
